name: caloVQ
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # core
      - torch==2.9.0
      - torchvision==0.24.0
      - torchmetrics
      - pytorch-lightning==2.6.5
      # config / utils
      - omegaconf
      - einops
      # data / numerics
      - numpy
      - h5py
      - scipy
      - matplotlib
      - psutil
      # experiment tracking / validation-metric logging
      - wandb
