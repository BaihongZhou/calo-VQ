# DarkSHINE stage 1 (VQ-VAE) smoke config.
# Geometry: channels-last (N,43,43,11) -> channels-first (N,11,43,43); depth(11)
# is the conv channel axis, (x,y)=43x43 the image plane (padded to 48 internally).
data:
  target: calo_ldm.data.DataModuleFromConfig
  params:
    num_workers: 16
    pin_memory: false
    batch_size: 256
    train:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j0/export.h5"
        - "DarkSHINE_data/j1/export.h5"
        - "DarkSHINE_data/j2/export.h5"
        - "DarkSHINE_data/j3/export.h5"
        - "DarkSHINE_data/j4/export.h5"
        - "DarkSHINE_data/j5/export.h5"
        - "DarkSHINE_data/j6/export.h5"
        - "DarkSHINE_data/j7/export.h5"
        - "DarkSHINE_data/j8/export.h5"
        - "DarkSHINE_data/j9/export.h5"
        - "DarkSHINE_data/j10/export.h5"
        - "DarkSHINE_data/j11/export.h5"
        - "DarkSHINE_data/j12/export.h5"
        - "DarkSHINE_data/j13/export.h5"
    validation:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j14/export.h5"
        - "DarkSHINE_data/j15/export.h5"

model:
  target: calo_ldm.models.VQModel
  params:
    dataset_name: darkshine
    mask_path: DarkSHINE_data/geom_mask.npy
    do_metric: true            # log reco-vs-truth physics metrics each val epoch
    metric_freq: 1             # emit histograms/figure every N val epochs
    metric_hit_threshold: 0.1  # [MeV] cell energy above which a cell counts as a hit
    downsample_mode: sum       # 43x43 -> 21x21 crystal aggregation: sum | min
    convert_to_detector_shape: false  # true -> postprocess output is (N,11,21,21) (ONNX/export)
    embed_dim: 64
    n_embed: 1024
    cond_dim: 1
    log_scale_params:
    - 0
    - 3000
    - 7
    reco_normalization: U
    disc_normalization: U
    encoder_config:
      target: calo_ldm.models.Encoder
      params:
        ch_in: 11
        ch_out: 128
        conv_spec:
        - 'pconv : k3 :     : p :    : c16'   # (16, 48, 48)
        - 'pconv : k4 : s2 : p : *2 :'        # (32, 24, 24)
        - 'pconv : k4 : s2 : p : *2 :'        # (64, 12, 12)
        - 'pconv : k4 : s2 : p : *2 :'        # (128, 6, 6)
    decoder_config:
      target: calo_ldm.models.Decoder
      params:
        ch_in: 128
        ch_out: 11
        conv_spec:
        - 'pconvT : k4 : s2 : p :    : c64'   # (64, 12, 12)
        - 'pconvT : k4 : s2 : p : /2 :'       # (32, 24, 24)
        - 'pconvT : k4 : s2 : p : /2 :'       # (16, 48, 48)
    loss_config:
      target: calo_ldm.losses.CombinedLoss
      params:
        pixel_power: 1
        pixel_weight: 1
        ec_weight: 0.0001
        width_weight: 0.0001
        disc_start: 10000      # let shape reconstruction/codebook warm up before GAN pressure
        disc_weight: 0.2
        codebook_weight: 1.0
        disc_config:
          target: calo_ldm.models.Discriminator
          params:
            pooling: null
            ch_in: 11
            conv_spec:
            - 'pconv : k3 :     : p :    : c16'  # (16, 48, 48)
            - 'pconv : k4 : s2 : p : *2 :'       # (32, 24, 24)
            - 'pconv : k4 : s2 : p : *2 :'       # (64, 12, 12)
            - 'pconv : k4 : s2 : p : *2 :'       # (128, 6, 6)
        n_embed: 1024
        reco_normalization: U
        disc_normalization: U
        dataset_name: darkshine
  base_learning_rate: 2.0e-06
  monitor: val/rec_loss
lightning:
  trainer:
    max_epochs: 200
    log_every_n_steps: 1
    enable_progress_bar: true
    strategy: 'ddp_find_unused_parameters_true'
