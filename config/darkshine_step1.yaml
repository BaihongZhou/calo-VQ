# DarkSHINE stage 1 (VQ-VAE) -- CNN + bottleneck self-attention.
# Identical to config/darkshine_step1.yaml (the hit-head baseline of record) EXCEPT
# the encoder/decoder each get 2 self-attention blocks at the 6x6 latent bottleneck
# (taming-transformers / VQGAN pattern). 36 tokens -> cheap; the zero-init residual
# makes attn an identity at init, so this can only help vs the pure-CNN baseline.
# Low-risk test of whether global mixing buys shape fidelity (width / z_sigma) before
# any wholesale ViT rewrite.
#   PY=/Users/zhoubaihong/miniconda3/envs/caloVQ/bin/python
#   $PY main.py --base config/darkshine_step1.yaml -t True -l logs -n dss1_attn --max_epochs 30
data:
  target: calo_ldm.data.DataModuleFromConfig
  params:
    num_workers: 16
    pin_memory: false
    batch_size: 256
    train:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j0/export.h5"
        - "DarkSHINE_data/j1/export.h5"
        - "DarkSHINE_data/j2/export.h5"
        - "DarkSHINE_data/j3/export.h5"
        - "DarkSHINE_data/j4/export.h5"
        - "DarkSHINE_data/j5/export.h5"
        - "DarkSHINE_data/j6/export.h5"
        - "DarkSHINE_data/j7/export.h5"
        - "DarkSHINE_data/j8/export.h5"
        - "DarkSHINE_data/j9/export.h5"
        - "DarkSHINE_data/j10/export.h5"
        - "DarkSHINE_data/j11/export.h5"
        - "DarkSHINE_data/j12/export.h5"
        - "DarkSHINE_data/j13/export.h5"
    validation:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j14/export.h5"
        - "DarkSHINE_data/j15/export.h5"

model:
  target: calo_ldm.models.VQModel
  params:
    dataset_name: darkshine
    mask_path: DarkSHINE_data/geom_mask.npy
    do_metric: true
    metric_freq: 1
    metric_hit_threshold: 0.1
    downsample_mode: sum
    convert_to_detector_shape: false
    hit_gate: true             # keep the occupancy decomposition that the baseline uses
    hit_gate_threshold: 0.4
    embed_dim: 64
    n_embed: 1024
    cond_dim: 1
    log_scale_params:
    - 0
    - 3000
    - 7
    reco_normalization: U
    disc_normalization: U
    encoder_config:
      target: calo_ldm.models.Encoder
      params:
        ch_in: 11
        ch_out: 128
        bottleneck_attn: 2       # self-attention at the 6x6 latent
        conv_spec:
        - 'pconv : k3 :     : p :    : c16'   # (16, 48, 48)
        - 'pconv : k4 : s2 : p : *2 :'        # (32, 24, 24)
        - 'pconv : k4 : s2 : p : *2 :'        # (64, 12, 12)
        - 'pconv : k4 : s2 : p : *2 :'        # (128, 6, 6)
    decoder_config:
      target: calo_ldm.models.Decoder
      params:
        ch_in: 128
        ch_out: 11
        bottleneck_attn: 2       # self-attention at the 6x6 latent
        conv_spec:
        - 'pconvT : k4 : s2 : p :    : c64'   # (64, 12, 12)
        - 'pconvT : k4 : s2 : p : /2 :'       # (32, 24, 24)
        - 'pconvT : k4 : s2 : p : /2 :'       # (16, 48, 48)
    loss_config:
      target: calo_ldm.losses.CombinedLoss
      params:
        pixel_power: 1
        pixel_weight: 1
        ec_weight: 0.0001
        width_weight: 0.0001
        hit_weight: 1.0
        hit_threshold: 0.025
        disc_start: 10000
        disc_weight: 0.2
        codebook_weight: 1.0
        disc_config:
          target: calo_ldm.models.Discriminator
          params:
            pooling: null
            ch_in: 11
            conv_spec:
            - 'pconv : k3 :     : p :    : c16'  # (16, 48, 48)
            - 'pconv : k4 : s2 : p : *2 :'       # (32, 24, 24)
            - 'pconv : k4 : s2 : p : *2 :'       # (64, 12, 12)
            - 'pconv : k4 : s2 : p : *2 :'       # (128, 6, 6)
        n_embed: 1024
        reco_normalization: U
        disc_normalization: U
        dataset_name: darkshine
  base_learning_rate: 2.0e-06
  monitor: val/rec_loss
lightning:
  trainer:
    max_epochs: 600
    log_every_n_steps: 1
    enable_progress_bar: true
    strategy: 'ddp_find_unused_parameters_true'
