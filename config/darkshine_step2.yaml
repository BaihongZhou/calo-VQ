# DarkSHINE stage 2 (GPT prior) smoke config.
# `vq_config.checkpoint` is overridden on the CLI with the stage-1 checkpoint.
# R = E_dep/E_inc ~ 0.97 for DarkSHINE (3.9 GeV deposited / 4 GeV incident, now in
# matching MeV units). R_max is set just above the observed maximum (~1.0) and
# R_bits gives fine resolution.
data:
  target: calo_ldm.data.DataModuleFromConfig
  params:
    num_workers: 16
    pin_memory: false
    batch_size: 256
    train:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j0/export.h5"
        - "DarkSHINE_data/j1/export.h5"
        - "DarkSHINE_data/j2/export.h5"
        - "DarkSHINE_data/j3/export.h5"
        - "DarkSHINE_data/j4/export.h5"
        - "DarkSHINE_data/j5/export.h5"
        - "DarkSHINE_data/j6/export.h5"
        - "DarkSHINE_data/j7/export.h5"
        - "DarkSHINE_data/j8/export.h5"
        - "DarkSHINE_data/j9/export.h5"
        - "DarkSHINE_data/j10/export.h5"
        - "DarkSHINE_data/j11/export.h5"
        - "DarkSHINE_data/j12/export.h5"
        # load_partial: 512
    validation:
      target: calo_ldm.data.CaloDarkSHINE
      params:
        sample_list:
        - "DarkSHINE_data/j13/export.h5"
        - "DarkSHINE_data/j14/export.h5"
        - "DarkSHINE_data/j15/export.h5"
        # load_partial: 256
model:
  base_learning_rate: 3.0e-06
  monitor: val/loss
  target: calo_ldm.models.CondGPT
  params:
    R_renorm: true
    do_metric: true            # log generation-vs-truth physics metrics
    record_freq: 1             # run generation + emit metrics every N val epochs (gen is the costly part)
    metric_hit_threshold: 0.1  # [MeV] cell energy above which a cell counts as a hit
    downsample_mode: sum       # 43x43 -> 21x21 crystal aggregation: sum | min
    convert_to_detector_shape: false  # true -> generated showers are (N,11,21,21) (ONNX/export)
    codebook_size: 1024
    sequence_shape:
    - 6
    - 6
    n_layer: 2
    n_head: 2
    n_embd: 64
    predict_R: true
    R_bits: 16
    R_max: 1.1
    cond_bins: 0
    vq_config:
      model_config: config/darkshine_step1.yaml
      # validated stage-1 (units + EMA-VQ + hit head); override on the CLI for new runs.
      checkpoint: logs/2026-06-15T05-23-08_dss1/checkpoints/epoch=000989.ckpt
lightning:
  trainer:
    max_epochs: 200
    log_every_n_steps: 1
    enable_progress_bar: true
    strategy: 'ddp_find_unused_parameters_true'
