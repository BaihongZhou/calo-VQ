# Smoke-test config for ds2 stage 2 (GPT prior over the frozen stage-1 codebook).
# `vq_config.checkpoint` is overridden on the command line with the actual stage-1
# checkpoint produced by the ds2_step1_smoke run.
data:
  target: calo_ldm.data.DataModuleFromConfig
  params:
    num_workers: 0
    pin_memory: false
    batch_size: 64
    train:
      target: calo_ldm.data.CaloHDF5
      params:
        file_path: "paper_data/dataset_2_1.hdf5"
        do_rotations: true
        load_partial: 1024
    validation:
      target: calo_ldm.data.CaloHDF5
      params:
        file_path: "paper_data/dataset_2_2.hdf5"
        load_partial: 512
model:
  base_learning_rate: 3.0e-06
  monitor: val/loss
  target: calo_ldm.models.CondGPT
  params:
    pure_mode: true            # skip autoregressive sampling / physics metrics during the smoke test
    R_renorm: true
    record_freq: 1000
    codebook_size: 1024
    sequence_shape:
    - 17
    - 4
    n_layer: 2
    n_head: 2
    n_embd: 64
    predict_R: true
    R_bits: 10
    cond_bins: 0
    vq_config:
      model_config: config/ds2_step1_smoke.yaml
      checkpoint: OVERRIDE_ME.ckpt
lightning:
  trainer:
    max_epochs: 1
    limit_train_batches: 4
    limit_val_batches: 2
    num_sanity_val_steps: 0
    log_every_n_steps: 1
    enable_progress_bar: false
